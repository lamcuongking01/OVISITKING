<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop Key OVISIT</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: #0b0e14;
            color: #e8edf5;
            display: flex;
            justify-content: center;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 420px;
            width: 100%;
            background: #131a22;
            border-radius: 24px;
            padding: 20px 16px 30px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.7);
            border: 1px solid #2a3340;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        .header h1 {
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(135deg, #f7971e, #ffd200);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .balance-wrapper {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #1e2732;
            padding: 4px 12px 4px 8px;
            border-radius: 30px;
            cursor: pointer;
            border: 1px solid #2a3340;
            transition: 0.2s;
            font-size: 14px;
            font-weight: 600;
            color: #34c759;
        }
        .balance-wrapper:hover {
            border-color: #f7971e;
        }
        .balance-wrapper .icon {
            font-size: 16px;
        }
        .admin-row {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #1e2732;
            padding: 10px 14px;
            border-radius: 40px;
            margin: 10px 0 16px 0;
            border-left: 4px solid #ffd700;
        }
        .admin-row .name {
            font-weight: 700;
            font-size: 16px;
            color: #fff;
        }
        .admin-row .tag {
            color: #8899aa;
            font-size: 13px;
        }
        .verified {
            background: #1d9bf0;
            color: #fff;
            font-size: 11px;
            padding: 2px 10px;
            border-radius: 30px;
            font-weight: 600;
            display: inline-block;
            margin-left: 4px;
        }
        .stats {
            display: flex;
            gap: 10px;
            margin-bottom: 18px;
            background: #10171f;
            padding: 10px 12px;
            border-radius: 40px;
            justify-content: space-around;
        }
        .stats div {
            text-align: center;
        }
        .stats .num {
            font-weight: 700;
            font-size: 18px;
            color: #fff;
        }
        .stats .label {
            font-size: 11px;
            color: #8899aa;
        }
        .stats .num.active {
            color: #34c759;
        }
        .stats .num.expired {
            color: #ff3b30;
        }
        .section-title {
            font-size: 16px;
            font-weight: 600;
            margin: 18px 0 10px 0;
            color: #ccd7e6;
        }
        .selector-group {
            background: #10171f;
            border-radius: 16px;
            padding: 12px 14px;
            margin-bottom: 8px;
        }
        .selector-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            border-bottom: 1px solid #1e2732;
        }
        .selector-row:last-child {
            border-bottom: none;
        }
        .selector-row .label {
            color: #aab8c9;
            font-size: 14px;
        }
        .selector-row .value {
            background: #1e2732;
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 13px;
            color: #e8edf5;
            cursor: pointer;
            border: 1px solid #2a3340;
            transition: 0.2s;
        }
        .selector-row .value:hover {
            border-color: #f7971e;
        }
        .game-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 10px 0 8px 0;
        }
        .game-btn {
            background: #1e2732;
            border: 1px solid #2a3340;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 13px;
            color: #ccd7e6;
            cursor: pointer;
            transition: 0.2s;
        }
        .game-btn:hover {
            border-color: #f7971e;
            color: #fff;
        }
        .game-btn.selected {
            background: #f7971e;
            border-color: #f7971e;
            color: #0b0e14;
            font-weight: 600;
        }
        .game-btn.vip {
            border-color: #ffd700;
            color: #ffd700;
        }
        .game-btn.vip.selected {
            background: #ffd700;
            color: #0b0e14;
        }
        .game-btn.thuong {
            border-color: #34c759;
            color: #34c759;
        }
        .game-btn.thuong.selected {
            background: #34c759;
            color: #0b0e14;
        }
        .package-btn {
            background: #1e2732;
            border: 1px solid #2a3340;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 13px;
            color: #ccd7e6;
            cursor: pointer;
            transition: 0.2s;
        }
        .package-btn:hover {
            border-color: #34c759;
            color: #fff;
        }
        .package-btn.selected {
            background: #34c759;
            border-color: #34c759;
            color: #0b0e14;
            font-weight: 600;
        }
        .package-btn.permanent {
            border-color: #ffd700;
            color: #ffd700;
        }
        .package-btn.permanent.selected {
            background: #ffd700;
            color: #0b0e14;
        }
        .price-tag {
            background: #1e2732;
            border-radius: 16px;
            padding: 12px 16px;
            margin: 8px 0 14px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid #34c759;
        }
        .price-tag .price {
            font-size: 22px;
            font-weight: 700;
            color: #34c759;
        }
        .price-tag .price span {
            font-size: 14px;
            font-weight: 400;
            color: #8899aa;
        }
        .buy-btn {
            background: #34c759;
            border: none;
            color: #0b0e14;
            font-weight: 700;
            font-size: 16px;
            padding: 12px 0;
            border-radius: 40px;
            width: 100%;
            cursor: pointer;
            transition: 0.2s;
            margin: 4px 0 8px 0;
        }
        .buy-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .buy-btn:not(:disabled):hover {
            background: #28a745;
            transform: scale(1.01);
        }
        .note {
            font-size: 12px;
            color: #8899aa;
            text-align: center;
            padding: 4px 0 12px 0;
            border-bottom: 1px solid #1e2732;
        }
        .key-tabs {
            display: flex;
            gap: 4px;
            margin: 16px 0 12px 0;
            background: #10171f;
            padding: 4px;
            border-radius: 40px;
        }
        .key-tabs .tab {
            flex: 1;
            text-align: center;
            padding: 6px 0;
            border-radius: 30px;
            font-size: 13px;
            color: #8899aa;
            cursor: pointer;
            transition: 0.2s;
        }
        .key-tabs .tab.active {
            background: #1e2732;
            color: #fff;
            font-weight: 600;
        }
        .key-tabs .tab:hover:not(.active) {
            color: #ccd7e6;
        }
        .search-box {
            background: #10171f;
            border: 1px solid #1e2732;
            border-radius: 40px;
            padding: 10px 16px;
            width: 100%;
            color: #e8edf5;
            font-size: 14px;
            outline: none;
            margin-bottom: 14px;
        }
        .search-box::placeholder {
            color: #556677;
        }
        .empty-state {
            text-align: center;
            padding: 40px 0 20px 0;
            color: #556677;
        }
        .empty-state .icon {
            font-size: 48px;
            margin-bottom: 10px;
            opacity: 0.4;
        }
        .empty-state .sub {
            font-size: 13px;
            color: #3d4a5a;
        }
        .key-item {
            background: #10171f;
            border-radius: 12px;
            padding: 10px 14px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 3px solid #34c759;
        }
        .key-item .code {
            font-family: monospace;
            font-size: 14px;
            color: #e8edf5;
        }
        .key-item .status {
            font-size: 12px;
            padding: 2px 12px;
            border-radius: 30px;
            background: #1e2732;
        }
        .key-item .status.active {
            color: #34c759;
        }
        .key-item .status.expired {
            color: #ff3b30;
        }
        .key-item .status.locked {
            color: #ff9500;
        }
        .footer-spacer {
            height: 20px;
        }
        .auth-container {
            background: #10171f;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid #2a3340;
        }
        .auth-tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 14px;
            background: #0b0e14;
            padding: 4px;
            border-radius: 40px;
        }
        .auth-tabs .atab {
            flex: 1;
            text-align: center;
            padding: 8px 0;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            color: #8899aa;
            cursor: pointer;
            transition: 0.2s;
        }
        .auth-tabs .atab.active {
            background: #1e2732;
            color: #fff;
        }
        .auth-tabs .atab:hover:not(.active) {
            color: #ccd7e6;
        }
        .auth-form {
            display: none;
            flex-direction: column;
            gap: 10px;
        }
        .auth-form.show {
            display: flex;
        }
        .auth-form input {
            background: #0b0e14;
            border: 1px solid #2a3340;
            border-radius: 40px;
            padding: 10px 16px;
            color: #e8edf5;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
        }
        .auth-form input:focus {
            border-color: #f7971e;
        }
        .auth-form input::placeholder {
            color: #556677;
        }
        .auth-form .password-hint {
            font-size: 11px;
            color: #8899aa;
            padding: 0 4px;
        }
        .auth-form .password-hint .ok {
            color: #34c759;
        }
        .auth-form .password-hint .fail {
            color: #ff3b30;
        }
        .auth-btn {
            background: #f7971e;
            border: none;
            color: #0b0e14;
            font-weight: 700;
            font-size: 15px;
            padding: 10px 0;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 4px;
        }
        .auth-btn:hover {
            background: #e08e0b;
        }
        .auth-btn.secondary {
            background: #2a3340;
            color: #ccd7e6;
        }
        .auth-btn.secondary:hover {
            background: #3d4a5a;
        }
        .remember-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #8899aa;
            padding: 2px 4px;
        }
        .remember-row input[type="checkbox"] {
            accent-color: #f7971e;
            width: 16px;
            height: 16px;
            cursor: pointer;
        }
        .auth-error {
            color: #ff3b30;
            font-size: 12px;
            padding: 0 4px;
            min-height: 18px;
        }
        .auth-success {
            color: #34c759;
            font-size: 12px;
            padding: 0 4px;
            min-height: 18px;
        }
        .admin-panel {
            display: none;
            background: #10171f;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid #ffd700;
        }
        .admin-panel.show {
            display: block;
        }
        .admin-panel h3 {
            color: #ffd700;
            font-size: 15px;
            margin-bottom: 10px;
        }
        .admin-panel input {
            background: #0b0e14;
            border: 1px solid #2a3340;
            border-radius: 40px;
            padding: 10px 16px;
            color: #e8edf5;
            font-size: 14px;
            outline: none;
            width: 100%;
            margin-bottom: 8px;
        }
        .admin-panel input:focus {
            border-color: #ffd700;
        }
        .admin-panel .gen-btn {
            background: #ffd700;
            border: none;
            color: #0b0e14;
            font-weight: 700;
            padding: 10px 0;
            border-radius: 40px;
            width: 100%;
            cursor: pointer;
        }
        .admin-panel .gen-btn:hover {
            background: #e6c200;
        }
        .admin-panel .key-output {
            background: #0b0e14;
            padding: 8px 14px;
            border-radius: 30px;
            font-family: monospace;
            font-size: 13px;
            color: #34c759;
            margin-top: 6px;
            word-break: break-all;
            border: 1px dashed #2a3340;
        }
        .logout-btn {
            background: #ff3b30;
            border: none;
            color: #fff;
            font-weight: 700;
            font-size: 13px;
            padding: 6px 16px;
            border-radius: 30px;
            cursor: pointer;
            margin-left: auto;
        }
        .logout-btn:hover {
            background: #d92d23;
        }
        /* Modal nạp tiền */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-overlay.show {
            display: flex;
        }
        .modal {
            background: #131a22;
            border-radius: 24px;
            padding: 24px 20px;
            max-width: 400px;
            width: 100%;
            border: 1px solid #2a3340;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal h2 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 16px;
            color: #ffd700;
        }
        .modal .close-btn {
            float: right;
            background: none;
            border: none;
            color: #8899aa;
            font-size: 24px;
            cursor: pointer;
        }
        .modal .close-btn:hover {
            color: #fff;
        }
        .modal .method-tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 16px;
            background: #0b0e14;
            padding: 4px;
            border-radius: 40px;
        }
        .modal .method-tabs .mtab {
            flex: 1;
            text-align: center;
            padding: 8px 0;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            color: #8899aa;
            cursor: pointer;
            transition: 0.2s;
        }
        .modal .method-tabs .mtab.active {
            background: #1e2732;
            color: #fff;
        }
        .modal .method-content {
            display: none;
            flex-direction: column;
            gap: 12px;
        }
        .modal .method-content.show {
            display: flex;
        }
        .modal .method-content input, .modal .method-content select {
            background: #0b0e14;
            border: 1px solid #2a3340;
            border-radius: 40px;
            padding: 10px 16px;
            color: #e8edf5;
            font-size: 14px;
            outline: none;
        }
        .modal .method-content input:focus, .modal .method-content select:focus {
            border-color: #ffd700;
        }
        .modal .method-content .info-row {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: #aab8c9;
            padding: 4px 0;
        }
        .modal .method-content .info-row .val {
            color: #34c759;
            font-weight: 600;
        }
        .modal .deposit-btn {
            background: #34c759;
            border: none;
            color: #0b0e14;
            font-weight: 700;
            font-size: 16px;
            padding: 12px 0;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 4px;
        }
        .modal .deposit-btn:hover {
            background: #28a745;
        }
        .modal .discount-note {
            font-size: 12px;
            color: #ff9500;
            text-align: center;
            padding: 4px 0;
        }
        .modal .bank-info {
            background: #0b0e14;
            border-radius: 16px;
            padding: 12px;
            border: 1px dashed #2a3340;
            font-size: 13px;
            color: #ccd7e6;
        }
        .modal .bank-info .row {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
        }
        .modal .bank-info .row .label {
            color: #8899aa;
        }
        .modal .qr-placeholder {
            background: #0b0e14;
            border-radius: 16px;
            padding: 30px;
            text-align: center;
            border: 2px dashed #2a3340;
            color: #556677;
            font-size: 14px;
        }
        @media (max-width: 450px) {
            .container { padding: 14px 10px; }
        }
    </style>
</head>
<body>

<div class="container" id="app">

    <!-- HEADER với số dư -->
    <div class="header">
        <h1>Shop Key OVISIT</h1>
        <div class="balance-wrapper" id="balanceWrapper">
            <span class="icon">💰</span>
            <span id="balanceDisplay">0đ</span>
        </div>
    </div>

    <div class="admin-row">
        <span class="name">ADMIN: OVISITKING</span>
        <span class="verified">✓ XANH</span>
        <span style="margin-left:auto; font-size:13px; color:#8899aa;">@OVISITKING</span>
        <button class="logout-btn" id="logoutBtn" style="display:none;">Đăng xuất</button>
    </div>

    <!-- AUTH -->
    <div class="auth-container" id="authContainer">
        <div class="auth-tabs">
            <span class="atab active" data-atform="login">Đăng nhập</span>
            <span class="atab" data-atform="register">Đăng ký</span>
        </div>
        <div class="auth-form show" id="loginForm">
            <input type="text" id="loginUsername" placeholder="Tên đăng nhập" autocomplete="username">
            <input type="password" id="loginPassword" placeholder="Mật khẩu" autocomplete="c
